version: "3.9"
services:
  mongo:
    image: "mongo:latest"
    container_name: "mongo"
    ports:
      - "27017:27017"
    volumes:
      # named volumes
      - mongodb:/data/db
      - mongoconfig:/data/configdb
    networks:
      - hotel-reservation-api
  api:
    #mage: "hotel_reservation_api:latest"
    container_name: hotel-reservation
    ports:
      - "5000:5000"
    depends_on:
      - "mongo"
    networks:
      - hotel-reservation-api

networks:
  hotel-reservation-api:
    driver: bridge

volumes:
  # default dir on Ubuntu: /var/lib/docker/volumes
  mongodb:
  mongoconfig:
